<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Input onclick:<input type="text" oninput="this.value=this.value.toUpperCase()"><br><br>
    Input onchange:<input type="text" onchange="this.value=this.value.toUpperCase()"><br><br>
    Input onblur:<input type="text" onblur="this.value=this.value.toUpperCase()"><br><br>
    Input onfocus:<input type="text" onfocus="this.value=this.value.toUpperCase()"><br><br>
    Input onfocus:<input type="text" onfocus="this.value=this.value.toUpperCase()"><br><br>

    <form action="#" onsubmit="myfunction()">
        Enter Name:<input type="text" name="fname" id="fname">
        <input type="submit" value="submit">
    </form>
    <script>
        function myfunction()
        {
            a=document.getElementById("fname").value;
            alert("The form was submitted!! Welcome "+a);
        }
    </script>
</body>
</html>
