    <script>
        //<!-- Syntax -->
        //functionname=(parameter1,parameter2)=>expression
        const square=(x)=>x*x;
        console.log(square(5));

        const add=(a,b)=>a+b;
        console.log("addition="+add(5,10));
        console.log(`addition=${add(5,10)}`);

        const sayHello=()=>"Hello";
        console.log(sayHello())
    </script>
