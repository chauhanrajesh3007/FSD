<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        function fun()
        {
            pat=/\W+/
            u=document.getElementById("t1").value;
            if(u.length<=8)
            {
                alert("Password must be greater than 8");
            }
            else if(!pat.test(u))
            {
                alert("Password must be strong");
            }
            else
            {
                alert("Password Entered:"+u);
            }
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="password" id="t1">
    <input type="submit" onclick="fun()">
</body>
</html>
