<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        //<!-- 1.Alert -->
        function warn()
        {
        alert("This is a warning massage");
        document.write("warning");
        }

         //<!-- 2.Confirm -->
         function conf()
         {
            res=confirm("Do you want to continue?")
            if (res==true)
            {
                document.write("User want");
                return true;
            }
            else
            {
                document.write("User does not want");
                return false;
            }
         }

         //<!-- 3.Prompt -->
         function getval()
         {
            res=prompt("Enter your name","your name here");
            document.write("you entered "+res);
         }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="button" value="ok" onclick="warn()"><br><br>
    <input type="button" value="confirm" onclick="conf()"><br><br>
    <input type="button" value="prompt" onclick="getval()">
</body>
</html>
