<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        //<!-- 1.Pre-Increment -->
        let a=5;
        let b=++a;
        console.log(a);
        console.log(b);

        //<!-- 2.Post-Increment -->
        let a1=5;
        let b1=a1++;
        console.log(a1);
        console.log(b1);

        //<!-- 3.Pre-decrement -->
        let a2=5;
        let b2=--a2;
        console.log(a2);
        console.log(b2);

        //<!-- 4.Post-Increment -->
        let a3=5;
        let b3=a3--;
        console.log(a3);
        console.log(b3);
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

</body>
</html>
