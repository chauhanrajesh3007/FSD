<!-- CH-10 Modern JS: Async, Fetch & Form
Way to access form element  -->
<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        function fun()
        {
            //method-1
            //var object=document.f1.t1.value;//f1=form name & t1=element name

            //method-2
            //var object=document.forms["f1"]["t2"].value;

            //method-3
            var object=document.getElementById("i1").value; 

                if (object.length==0)
                {
                    alert("Please Enter Something");
                    return false
                }
            alert(object);
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form name="f1" onsubmit="return fun()">
        <input type="text" name="t1" id="i1">
        <input type="submit">
</body>
</html>
